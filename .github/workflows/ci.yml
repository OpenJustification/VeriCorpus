name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr python3-tk

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src scripts packaging

      - name: Lint
        run: python -m ruff check src tests scripts packaging

      - name: Validate release metadata and reference licensing policy
        run: |
          python scripts/release_check.py
          python scripts/license_check.py

      - name: Run tests
        run: |
          python -m pytest -q
          python -m vericorpus.desktop --self-test

      - name: Inventory installed Python licenses
        if: matrix.python-version == '3.12'
        run: pip-licenses --format=json --output-file=python-license-inventory.json

      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m twine check dist/*
