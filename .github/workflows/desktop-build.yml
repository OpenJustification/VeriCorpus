name: Desktop bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            flavor: lite
            archive: zip
          - os: windows-latest
            platform: Windows-x64
            flavor: standard
            archive: zip
          - os: windows-latest
            platform: Windows-x64
            flavor: verified
            archive: zip
          - os: ubuntu-24.04
            platform: Linux-x86_64
            flavor: lite
            archive: tar
          - os: ubuntu-24.04
            platform: Linux-x86_64
            flavor: standard
            archive: tar
          - os: ubuntu-24.04
            platform: Linux-x86_64
            flavor: verified
            archive: tar
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0 libgomp1 tesseract-ocr clamav

      - name: Install pinned build/runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          if [ "${{ matrix.flavor }}" != "lite" ]; then
            echo "Installing FULL desktop dependency lock"
            python -m pip install --prefer-binary -r packaging/requirements-bundle-full.txt --report pip-install-report.json
          else
            echo "Installing LITE desktop dependency lock"
            python -m pip install --prefer-binary -r packaging/requirements-bundle-lite.txt --report pip-install-report.json
          fi
          python -m pip check
          python -m pip install --no-deps .
          python -m pip install pyinstaller==6.22.3 pip-licenses==5.0.0
          python -m pip check

      - name: Source smoke test
        shell: bash
        run: |
          python -m vericorpus.desktop --self-test
          python scripts/release_check.py
          python scripts/license_check.py

      - name: Build graphical desktop bundle
        shell: bash
        env:
          VERICORPUS_BUNDLE: ${{ matrix.flavor }}
        run: |
          set -euxo pipefail
          python scripts/build_desktop.py --flavor "${{ matrix.flavor }}"

      - name: Add Tesseract for Verified Windows
        if: runner.os == 'Windows' && matrix.flavor == 'verified'
        shell: pwsh
        run: .\packaging\stage_tesseract_windows.ps1

      - name: Upload PyInstaller diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-diagnostics-${{ matrix.platform }}-${{ matrix.flavor }}
          path: |
            build/
            *.log
          if-no-files-found: ignore

      - name: Add release documentation and inventories
        shell: bash
        run: |
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md dist/VeriCorpus/
          python -m pip freeze > dist/VeriCorpus/python-freeze.txt
          pip-licenses --format=json --output-file=dist/VeriCorpus/python-license-inventory.json
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          info = {
              "vericorpus": "0.2.0a1",
              "git_sha": os.environ.get("GITHUB_SHA", "unknown"),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "python": sys.version,
              "bundle_flavor": os.environ.get("BUNDLE_FLAVOR", "unknown"),
              "pyinstaller": subprocess.check_output([sys.executable,"-m","PyInstaller","--version"], text=True).strip(),
          }
          Path("dist/VeriCorpus/BUILD_INFO.json").write_text(json.dumps(info, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          PY
        env:
          BUNDLE_FLAVOR: ${{ matrix.flavor }}

      - name: Smoke-test packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VERICORPUS_SELFTEST_OUTPUT = "$pwd\desktop-selftest.json"
          Remove-Item desktop-selftest.json -ErrorAction SilentlyContinue

          $exe = (Resolve-Path ".\dist\VeriCorpus\VeriCorpus.exe").Path
          Write-Host "Launching packaged GUI executable synchronously: $exe"

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test" `
            -WorkingDirectory "$pwd" `
            -Wait `
            -PassThru

          $exitCode = $proc.ExitCode
          Write-Host "VeriCorpus.exe exit code: $exitCode"

          if (Test-Path desktop-selftest.json) {
            Write-Host "Packaged self-test result:"
            Get-Content desktop-selftest.json
          } else {
            Write-Host "Packaged executable did not create desktop-selftest.json"
          }

          if ($exitCode -ne 0) {
            throw "Packaged Windows self-test failed with exit code $exitCode"
          }
          if (-not (Test-Path desktop-selftest.json)) {
            throw "Packaged Windows self-test exited successfully but produced no result file"
          }

          $r = Get-Content desktop-selftest.json | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.version -ne "0.2.0a1") {
            throw "Unexpected packaged self-test result: $($r | ConvertTo-Json -Compress)"
          }

      - name: Microsoft Defender scan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles\Windows Defender\MpCmdRun.exe")
          $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
          if (Test-Path $platformRoot) {
            $candidates += Get-ChildItem $platformRoot -Recurse -Filter MpCmdRun.exe -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | ForEach-Object { $_.FullName }
          }
          $mp = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mp) { throw "Microsoft Defender command-line scanner not available on runner" }
          & $mp -Scan -ScanType 3 -File (Resolve-Path .\dist\VeriCorpus).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan returned exit code $LASTEXITCODE" }

      - name: Smoke-test packaged Linux executable
        if: runner.os == 'Linux'
        run: |
          export VERICORPUS_SELFTEST_OUTPUT="$PWD/desktop-selftest.json"
          ./dist/VeriCorpus/VeriCorpus --self-test
          python - <<'PY'
          import json
          d=json.load(open('desktop-selftest.json', encoding='utf-8'))
          assert d['status']=='PASS' and d['version']=='0.2.0a1', d
          PY

      - name: ClamAV scan
        if: runner.os == 'Linux'
        run: |
          sudo freshclam || true
          set +e
          clamscan -r --infected --no-summary dist/VeriCorpus
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then echo "Malware signature detected"; exit 1; fi
          if [ "$code" -gt 1 ]; then echo "ClamAV scanner error code $code"; exit "$code"; fi

      - name: Create Windows archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}"
          Compress-Archive -Path .\dist\VeriCorpus\* -DestinationPath "$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Create Linux archive and checksum
        if: runner.os == 'Linux'
        run: |
          name="VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}"
          tar -C dist -czf "$name.tar.gz" VeriCorpus
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}
          path: |
            VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}.zip
            VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}.zip.sha256
            VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}.tar.gz
            VeriCorpus-0.2.0-${{ matrix.platform }}-${{ matrix.flavor }}.tar.gz.sha256
            pip-install-report.json
          if-no-files-found: ignore
