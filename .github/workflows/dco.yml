name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r commit; do
            [ -n "$commit" ] || continue
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a DCO Signed-off-by line."
              failed=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "$failed" -ne 0 ]; then
            echo "Sign commits with: git commit -s"
            exit 1
          fi
